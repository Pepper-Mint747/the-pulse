name: Build & push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]          # v1.2.3 -> also tagged 1.2.3, 1.2
  pull_request:           # build + smoke test only, never pushes
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub repo: <your username>/the-pulse (created automatically on first push)
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/the-pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # emulate ARM for the Pi builds
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: the-pulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run smoke test
        run: |
          docker run --rm -v "$PWD/config.example.toml:/config/config.toml:ro" the-pulse:ci schedule
          docker run --rm --entrypoint python the-pulse:ci -c \
            "import the_pulse.nse, the_pulse.kplc, the_pulse.rain, the_pulse.news, the_pulse.briefing; print('imports ok')"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build & push (amd64 + Raspberry Pi arm64/armv7)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
